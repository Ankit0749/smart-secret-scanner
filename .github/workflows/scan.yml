name: Secret Scan Pipeline

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Secret Scanner
        run: python main.py

      - name: Fail if HIGH risk found
        run: |
          if grep -q "HIGH" report.json; then
            echo "High risk secrets detected!"
            exit 1
          else
            echo "No high-risk secrets"
          fi